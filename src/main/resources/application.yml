spring:
  application:
    name: workers-salary-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workers_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
