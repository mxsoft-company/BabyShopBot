<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kompaniya formasi — Admin</title>
    <style>
        :root {
            --primary: #4f46e5; --primary-dark: #4338ca; --bg: #f7f7fb;
            --card: #ffffff; --border: #e5e7eb; --text: #1f2937; --text-muted: #6b7280;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
               margin: 0; background: var(--bg); color: var(--text); }
        .topbar { background: var(--card); border-bottom: 1px solid var(--border);
                  padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        .topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
        .topbar .brand .dot { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); display: inline-block; }
        .topbar a.logout { color: var(--text-muted); text-decoration: none; font-size: 14px; }
        .topbar a.logout:hover { color: #dc2626; }
        .topbar button.logout:hover { color: #dc2626; }
        .container { max-width: 560px; margin: 32px auto; padding: 0 24px; }
        h1 { font-size: 20px; margin: 0 0 20px 0; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
        .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase;
                          letter-spacing: .04em; color: var(--text-muted); margin: 24px 0 4px 0; }
        .section-hint { font-size: 12px; color: var(--text-muted); margin: 0 0 12px 0; }
        label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 9px 12px; margin-top: 5px; border: 1px solid var(--border);
            border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
        .checkbox-row { margin-top: 18px; display: flex; align-items: center; gap: 8px; }
        .checkbox-row label { margin: 0; font-weight: 600; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0 0 0; }
        .actions { margin-top: 24px; display: flex; gap: 10px; align-items: center; }
        .btn { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border);
               background: #fff; cursor: pointer; font-size: 14px; font-weight: 600;
               text-decoration: none; color: var(--text); }
        .btn:hover { border-color: var(--primary); color: var(--primary); }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); color: #fff; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand"><span class="dot"></span> Bot Boshqaruv Paneli</div>
    <form th:action="@{/admin/logout}" method="post" style="margin:0;">
        <button type="submit" class="logout"
                style="background:none; border:none; padding:0; cursor:pointer; font: inherit; color: #6b7280;">Chiqish →</button>
    </form>
</div>
<div class="container">
    <h1 th:if="${company.id == null}">Yangi kompaniya</h1>
    <h1 th:if="${company.id != null}">Kompaniyani tahrirlash</h1>

    <div class="card">
        <form th:action="@{/admin/companies}" th:object="${company}" method="post">
            <div th:if="${error}" style="background:#fee2e2; color:#dc2626; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:14px;" th:text="${error}"></div>
            <input type="hidden" th:field="*{id}">

            <label for="name">Kompaniya nomi</label>
            <input type="text" id="name" th:field="*{name}" required>

            <label for="botToken">Bot tokeni</label>
            <input type="text" id="botToken" th:field="*{botToken}" required>

            <label for="botUsername">Bot username</label>
            <input type="text" id="botUsername" th:field="*{botUsername}" required>

            <label for="onecBaseUrl">Base URL (1C)</label>
            <input type="text" id="onecBaseUrl" th:field="*{onecBaseUrl}" required>

            <label for="onecUsername">1C login</label>
            <input type="text" id="onecUsername" th:field="*{onecUsername}" required>

            <label for="onecPassword">1C parol</label>
            <input type="password" id="onecPassword" th:field="*{onecPassword}" required>

            <label for="serviceAuthUsername">Service auth username</label>
            <input type="text" id="serviceAuthUsername" th:field="*{serviceAuthUsername}" required>

            <label for="serviceAuthPassword">Service auth password</label>
            <input type="password" id="serviceAuthPassword" th:field="*{serviceAuthPassword}" required>

            <hr>
            <p class="section-title">HR Pulse</p>
            <p class="section-hint">Ixtiyoriy — davomat moduli uchun</p>

            <label for="hrpulseBaseUrl">HR Pulse Base URL</label>
            <input type="text" id="hrpulseBaseUrl" th:field="*{hrpulseBaseUrl}">

            <label for="hrpulseToken">HR Pulse Token</label>
            <input type="password" id="hrpulseToken" th:field="*{hrpulseToken}">

            <div class="checkbox-row">
                <input type="checkbox" id="active" th:field="*{active}">
                <label for="active">Faol</label>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Saqlash</button>
                <a class="btn" th:href="@{/admin/companies}">Bekor qilish</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
