<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin panel — Kirish</title>
    <style>
        :root { --primary: #4f46e5; --primary-dark: #4338ca; --border: #e5e7eb; --text: #1f2937; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #eef0ff 0%, #f7f7fb 60%); color: var(--text);
        }
        .login-box {
            width: 100%; max-width: 360px; background: #fff; padding: 36px 32px;
            border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 30px rgba(17,17,26,.06);
        }
        .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 18px; }
        .brand .dot { width: 32px; height: 32px; border-radius: 9px; background: var(--primary); display: inline-block; }
        h1 { margin: 0 0 4px 0; font-size: 19px; text-align: center; }
        .subtitle { text-align: center; font-size: 13px; color: #6b7280; margin: 0 0 20px 0; }
        label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px 12px; margin-top: 5px; border: 1px solid var(--border);
            border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
        button {
            width: 100%; margin-top: 22px; padding: 11px; background: var(--primary); color: #fff;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;
        }
        button:hover { background: var(--primary-dark); }
        .error {
            color: #dc2626; text-align: center; margin-top: 14px; font-size: 13px;
            background: #fee2e2; padding: 8px; border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="brand"><span class="dot"></span></div>
    <h1>Admin panel</h1>
    <p class="subtitle">Kompaniyalarni boshqarish</p>
    <div class="error" th:if="${param.error}">Login yoki parol xato</div>
    <form th:action="@{/admin/login}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Kirish</button>
    </form>
</div>
</body>
</html>
